name: Pre-release acceptance

on:
  pull_request:
  workflow_dispatch:

# This workflow builds/tests only. It cannot publish images or deploy production.
permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config: .github/buildkitd.toml
      - name: Build complete production image without publishing
        uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          load: true
          push: false
          tags: utils-acceptance:local
      - name: Verify final-image startup, persistence and backup
        env:
          IMAGE_ID: ${{ steps.image.outputs.imageid }}
        run: node tests/image-smoke.cjs "$IMAGE_ID"
