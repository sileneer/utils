name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Keyless deploy: WIF-authenticated as utils-deploy@…, ephemeral SSH key written
  # to instance metadata (removed afterwards), SSH through the IAP tunnel running
  # /opt/utils/deploy.sh (flock → compose pull → up → healthcheck → rollback).
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to GCP (Workload Identity Federation, no keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/970395615458/locations/global/workloadIdentityPools/github/providers/github
          service_account: utils-deploy@gen-lang-client-0642815057.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Add ephemeral SSH key to instance metadata
        run: |
          ssh-keygen -t ed25519 -N "" -C "gha-${GITHUB_SHA::7}" -f /tmp/deploy_key
          echo "utils-deploy:$(cat /tmp/deploy_key.pub)" > /tmp/ssh_keys
          gcloud compute instances add-metadata instance-20260904-233454 \
            --zone us-east1-c \
            --metadata-from-file ssh-keys=/tmp/ssh_keys --quiet
      - name: Deploy (flock → pull → up → healthcheck)
        run: |
          gcloud compute ssh utils-deploy@instance-20260904-233454 \
            --zone us-east1-c \
            --tunnel-through-iap \
            --ssh-key-file=/tmp/deploy_key \
            --command="/opt/utils/deploy.sh" \
            --strict-host-key-checking=no --quiet
      - name: Remove ephemeral SSH key
        if: always()
        run: gcloud compute instances remove-metadata instance-20260904-233454 \
            --zone us-east1-c --keys=ssh-keys --quiet
